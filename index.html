<!DOCTYPE html>
<html>
<head>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>FRC Scouting</title>
  <style>
    body { font-family: Arial; max-width: 600px; margin: 20px auto; padding: 10px; }
    input, textarea { width: 100%; padding: 8px; margin: 5px 0 15px 0; box-sizing: border-box; }
    label { display: block; margin-bottom: 5px; }
    button { padding: 10px 20px; font-size: 16px; cursor: pointer; }
  </style>
</head>
<body>

<h2>FRC Match Scouting</h2>

<form id="scoutForm">
  <input id="match" type="number" placeholder="Match #">
  <input id="team" type="number" placeholder="Team #">

  <strong>Team Actions</strong><br>
  <label><input type="checkbox" class="action" value="Auto Fuel"> Auto Fuel</label>
  <label><input type="checkbox" class="action" value="Auto Climb"> Auto Climb</label>
  <label><input type="checkbox" class="action" value="Trench"> Trench</label>
  <label><input type="checkbox" class="action" value="Bump"> Bump</label>
  <label><input type="checkbox" class="action" value="Turret"> Turret</label>
  <label><input type="checkbox" class="action" value="Scored Fuel"> Scored Fuel</label>
  <label><input type="checkbox" class="action" value="L1 Climb"> L1 Climb</label>
  <label><input type="checkbox" class="action" value="L2 Climb"> L2 Climb</label>
  <label><input type="checkbox" class="action" value="L3 Climb"> L3 Climb</label>
  <label><input type="checkbox" class="action" value="Beached?"> Beached?</label>

  <textarea id="notes" placeholder="Notes" rows="4"></textarea>
  <button type="button" onclick="submitForm()">Send</button>
</form>

<script>
const webAppURL = "https://script.google.com/macros/s/AKfycbxkxIwU02qWNWlJsn5Hp3aDTcENfZPkU-BCUvE2dCY2r4aC2Res7gIcu0co4BWXuLNN/exec"; // replace with your Apps Script URL

function submitForm() {
  const match = document.getElementById("match").value;
  const team = document.getElementById("team").value;
  const notes = document.getElementById("notes").value;
  const actions = Array.from(document.querySelectorAll(".action:checked")).map(c => c.value).join(", ");

  fetch(webAppURL, {
    method: "POST",
    body: new URLSearchParams({
      match: match,
      team: team,
      actions: actions,
      notes: notes
    })
  })
  .then(r => r.json())
  .then(data => {
    alert("Submitted successfully!");
    document.getElementById("scoutForm").reset();
  })
  .catch(err => {
    console.error(err);
    alert("Submission failed. Check console for details.");
  });
}
</script>

</body>
</html>
